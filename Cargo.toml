[package]
name = "cb2crypt"
version = "2.0.0"
description = "App to decrypt & encrypt any cheat code for CodeBreaker PS2"
authors = ["Mathias Lafeldt <mathias.lafeldt@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mlafeldt/CB2crypt"
edition = "2024"
publish = false

[dependencies]
codebreaker = "0.4.1"
# A fork while what the app relies on (the editor's read-only mode, undo and
# horizontal scrolling, among others) is not released yet. The tag keeps the
# commit reachable when the fork's dev branch moves on.
saudade = { git = "https://github.com/mlafeldt/saudade", tag = "cb2crypt-v2.0.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
